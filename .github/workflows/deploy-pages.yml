name: Publikacja strony

# Publikuje stronę na GitHub Pages razem z version.json (wydanie + commit, widoczne w górnym pasku).
# Wymaga: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
# Uruchamiany po każdym pushu na main, ręcznie i z workflow „Aktualizacja rankingu”
# (push z tokenu Actions nie uruchamia innych workflowów, więc ten wywołuje publikację sam).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main          # przy wywołaniu z aktualizacji rankingu — razem z właśnie dopisaną rundą
          fetch-depth: 0     # historia i tagi do „v1.2.0+3”

      - name: Pliki strony i version.json
        run: |
          python3 tools/version.py
          mkdir _site
          cp -r index.html css js data assets feed.xml site.webmanifest version.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
