name: Aktualizacja rankingu

# parcfer.me pokazuje tylko bieżący ranking, więc sprawdzamy regularnie,
# czy jest nowa rozliczona runda, i dopisujemy ją do data/<rok>.json.
on:
  schedule:
    - cron: "23 */3 * * *"   # co 3 godziny
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pobierz nową rundę z parcfer.me
        run: python3 tools/add_round.py --auto

      - name: Sprawdź spójność danych
        run: python3 tools/check_data.py

      - name: Zapisz i opublikuj
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Brak nowej rundy."
            exit 0
          fi
          season=$(python3 -c "import json; print(json.load(open('data/seasons.json'))['default'])")
          round=$(python3 -c "import json; print(json.load(open('data/$season.json'))['rounds'][-1]['name'])")
          # runda już była w danych → to korekta punktów z parcfer.me
          if git show "HEAD:data/$season.json" 2>/dev/null | grep -qF "\"name\": \"$round\""; then msg="Korekta rundy $round"; else msg="Runda $round"; fi
          git config user.name "Patryk"
          git config user.email "169813447+patrykw-labs@users.noreply.github.com"
          git add data/ feed.xml
          git commit -m "$msg"
          git push
          # push z tokenu Actions nie zawsze uruchamia budowanie Pages — zlecamy je wprost
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Nie udało się zlecić budowania Pages"

      # GitHub wyłącza harmonogram w publicznym repo po 60 dniach bez commitów (przerwa zimowa),
      # a pominiętej rundy nie da się potem odtworzyć — pusty commit co ok. 50 dni bez aktywności
      - name: Keepalive harmonogramu
        env:
          KEEPALIVE_DAYS: ${{ vars.KEEPALIVE_DAYS || '50' }}
        run: |
          git pull --ff-only -q
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( KEEPALIVE_DAYS * 86400 )) ]; then
            git config user.name "Patryk"
            git config user.email "169813447+patrykw-labs@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive harmonogramu aktualizacji"
            git push
          else
            echo "Ostatni commit $(( ($(date +%s) - last) / 86400 )) dni temu — keepalive niepotrzebny."
          fi
