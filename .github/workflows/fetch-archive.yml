name: Pobranie rankingu z Web Archive

# Jednorazowe: pobiera zapisane kopie strony rankingu parcfer.me z web.archive.org
# i zapisuje surowy HTML na gałęzi archive-raw (do odtworzenia starszych rund).
on:
  workflow_dispatch:
    inputs:
      timestamps:
        description: "Znaczniki czasu kopii w Web Archive (oddzielone spacją)"
        default: "20260410130648 20260716204734"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz kopie
        run: |
          mkdir -p archive
          for ts in ${{ github.event.inputs.timestamps }}; do
            # „id_” zwraca oryginalną stronę bez paska Web Archive
            curl -fsSL --retry 5 --retry-delay 10 -A "parcferme-ranking" \
              "https://web.archive.org/web/${ts}id_/https://parcfer.me/typowanie-ranking/2026" \
              -o "archive/ranking-${ts}.html"
            grep -q '__NEXT_DATA__' "archive/ranking-${ts}.html" || { echo "Brak danych rankingu w kopii ${ts}"; exit 1; }
            ls -la "archive/ranking-${ts}.html"
          done

      - name: Zapisz na gałęzi archive-raw
        run: |
          git init -q -b archive-raw
          git config user.name "Patryk"
          git config user.email "169813447+patrykw-labs@users.noreply.github.com"
          git add archive
          git commit -q -m "Kopie rankingu z Web Archive: ${{ github.event.inputs.timestamps }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" archive-raw
