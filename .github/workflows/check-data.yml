name: Sprawdzenie danych

on:
  push:
    paths: ["data/**", "tools/**", ".github/workflows/check-data.yml"]
  pull_request:
    paths: ["data/**", "tools/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Spójność danych rankingu
        run: python3 tools/check_data.py
