# Co tydzień sprawdza nowe wersje akcji GitHub Actions używanych w .github/workflows
# i otwiera pull request z podbiciem wersji.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Actions"
    groups:
      actions:
        patterns: ["*"]

  # Playwright w teście strony (tests/package.json)
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Testy"
